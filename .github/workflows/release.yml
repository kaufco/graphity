# Signs the published modules and uploads them to Maven Central via the Central
# Publisher Portal. Which modules those are is the parent POM's
# graphity.releaseModules list, all at the POM's version; today these are
# graphity-core, graphity-controlflow, graphity-dot, graphity-mermaid,
# graphity (which brings in the four) and graphity-bom.
#
# One trigger, workflow_dispatch, run before the GitHub Release is published:
# the portal validates the bundle while the release is still private, so a
# rejection stops the release instead of following it. The GitHub Release comes
# afterwards and starts only deploy-javadoc.yml. A second trigger on
# release.published would upload the same version again, which the portal
# rejects as a duplicate of the deployment this run left behind.
#
# Two inputs, because the ref that is built and the ref the workflow file comes
# from are different things. The run always uses the workflow file of the branch
# it is started from (normally main, so fixes to this file apply). What it
# builds is `ref`: a tag, a branch, or a full 40-character commit SHA (a short
# SHA is looked up as a branch or tag and fails). Left empty, it builds the tag
# named `version`. The regular release pushes that tag to the release commit
# first and leaves `ref` empty; the GitHub Release then picks up the existing
# tag, so the built commit and the released one are the same by construction.
#
# What the job does — and where it stops: it builds, tests, signs, uploads a
# bundle and waits for the portal to validate it. That is all. Making the release
# visible on Maven Central is a separate "Publish" in the portal, by hand,
# because a published version can never be withdrawn.
#
# The version comes from the `version` input and is checked against the POM of
# the ref that is built. That check notices a ref whose POM carries another
# version — most likely because the sync has not run yet. It cannot tell two
# commits with the same version apart; that is what building the tag is for.
#
# Required repository secrets:
#   GPG_PRIVATE_KEY         armored secret key (gpg --armor --export-secret-keys)
#   GPG_PASSPHRASE          passphrase of that key
#   CENTRAL_TOKEN_USERNAME  user token from central.sonatype.com
#   CENTRAL_TOKEN_PASSWORD
#
# The job is guarded with `if: github.repository == 'kaufco/graphity'` so that
# forks never attempt a deploy they have no credentials for.

name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must match the POM of the ref that is built (e.g. 3.0.0)'
        required: true
        type: string
      ref:
        description: 'Tag, branch or full commit SHA to build; empty builds the tag named like the version'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight: an interrupted
# upload would leave a partial deployment in the portal.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Sign & upload to Central
    if: github.repository == 'kaufco/graphity'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Determine the version and the ref to build
        id: target
        # Both inputs are passed through the environment rather than
        # interpolated into the script, so neither can be read as shell syntax.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Tags are unprefixed by convention; a v-prefixed version still works.
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "'$INPUT_VERSION' does not look like a release version." >&2
            exit 1
          fi
          # Blank input counts as empty: actions/checkout trims it and would fall
          # back to the dispatch branch, which is the mistake this input prevents.
          ref="${INPUT_REF//[[:space:]]/}"
          ref="${ref:-$version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing $version, built from '$ref'."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The ref to build, not the branch the workflow file came from: the
          # bundle must be built from the release commit.
          ref: ${{ steps.target.outputs.ref }}

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Writes a settings.xml containing <server id="central"> whose
          # credentials are read from the environment variables named here, and
          # imports the signing key into the runner's keyring.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Pin Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 on 2026-10-04. 3.10 writes
        # maven-metadata-local.xml beside the version directory; plugin 0.11.0
        # leaves it in the bundle and the portal rejects it ("does NOT have a
        # .pom file"). 2.1.0 still ran on 3.9.16. Do not use the runner's mvn.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/maven.zip \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
          echo "5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce  /tmp/maven.zip" | sha256sum -c -
          unzip -q /tmp/maven.zip -d "$HOME/.local"
          echo "$HOME/.local/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Check the POM version against the release
        env:
          EXPECTED: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          mvn -v
          pom="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$pom" != "$EXPECTED" ]]; then
            echo "The POM is at $pom, but this run was started for $EXPECTED." >&2
            echo "Either the ref is not the release commit, or that commit has not been synced yet." >&2
            exit 1
          fi
          echo "Publishing $pom."

      - name: Read the modules to publish
        id: modules
        run: |
          set -euo pipefail
          modules="$(mvn -B -ntp -q -N help:evaluate -Dexpression=graphity.releaseModules -DforceStdout)"
          if [[ ! "$modules" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "graphity.releaseModules in the parent POM is '$modules', not a comma-separated module list." >&2
            exit 1
          fi
          echo "list=$modules" >> "$GITHUB_OUTPUT"
          echo "Publishing modules: $modules"

      - name: Check the version of every module
        # Modules inherit the version from the parent POM - except graphity-bom, which has no
        # parent so that importing it brings no foreign dependencyManagement. A bump that missed
        # it would upload a BOM under the wrong version; this catches it before the build.
        env:
          EXPECTED: ${{ steps.target.outputs.version }}
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          set -euo pipefail
          for module in ${MODULES//,/ }; do
            version="$(mvn -B -ntp -q -N -f "$module/pom.xml" help:evaluate -Dexpression=project.version -DforceStdout)"
            if [[ "$version" != "$EXPECTED" ]]; then
              echo "$module is at $version, but this run was started for $EXPECTED." >&2
              exit 1
            fi
          done

      - name: Refuse a version that is already on Central
        # A second upload for a published version fails at the portal anyway,
        # after the build. Failing here says why, and says it before the build.
        # Every listed module is asked; one that was never published answers 404.
        env:
          VERSION: ${{ steps.target.outputs.version }}
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          set -euo pipefail
          for module in ${MODULES//,/ }; do
            url="https://repo1.maven.org/maven2/com/kobayami/$module/$VERSION/$module-$VERSION.pom"
            code="$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            case "$code" in
              200)
                echo "$module $VERSION is already on Maven Central. A published version cannot be replaced; release a new version instead." >&2
                exit 1
                ;;
              404) echo "$module $VERSION is not on Central yet." ;;
              *)   echo "Could not ask Central about $module (HTTP $code); continuing." ;;
            esac
          done

      - name: Build, sign and upload
        # The reactor is narrowed to the parent POM (which consumers need in
        # order to resolve the modules) and the modules listed in
        # graphity.releaseModules, so the benchmarks uber-jar stays out of the
        # bundle. The publishing plugin uploads one bundle for the whole
        # reactor at its end: a module that fails to build, test or sign stops
        # the run before anything is uploaded, so a release is all or nothing.
        env:
          MODULES: ${{ steps.modules.outputs.list }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: mvn -B -ntp -pl "$MODULES" -am clean deploy -P release
