# Builds the graphity-core Javadoc and deploys it to GitHub Pages.
#
# The job is guarded with `if: github.repository == 'kaufco/graphity'` so that
# forks don't attempt a Pages deploy they have neither the settings nor the
# permissions for.
#
# Two triggers:
#   * release.published — automatic run, the same event that starts the Maven
#     deploy (release.yml), so publishing a GitHub Release is the only act a
#     release needs. Only `published`, not `released`/`edited`: a later
#     correction of the release notes must not redeploy. Deliberately not on
#     push.tags as well — a release created from a new tag would fire both
#     triggers.
#   * workflow_dispatch — manual run, used before 1.0.0 to populate
#     https://kaufco.github.io/graphity/ from main HEAD so the page is
#     not blank, and as the fallback when a release already exists.
#
# The published Javadoc is the release's snapshot at Pages root; a versioned
# layout (/javadoc/<version>/, /javadoc/latest/) can be introduced later
# without changing the trigger model.
#
# Two repository settings are prerequisites:
#   * GitHub Pages source must be "GitHub Actions" — this workflow uses
#     actions/deploy-pages, not a gh-pages branch.
#   * The `github-pages` environment must allow tag deployments. By default it
#     permits the default branch only, and a release run stands in the tag's
#     ref, so it is rejected with "Tag X.Y.Z is not allowed to deploy to
#     github-pages due to environment protection rules". Add a tag rule under
#     Deployment branches and tags; until then, dispatch manually from main.

name: Deploy Javadoc

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows only one concurrent deployment. Don't cancel an in-flight
# deploy — let it finish so we never leave Pages in a half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Javadoc
    if: github.repository == 'kaufco/graphity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a release event this is the tag; a manual run takes the branch
          # it was started from.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Javadoc
        # javadoc:javadoc on graphity-core only; -am pulls in the parent POM.
        # doclint=all + failOnWarnings is configured in the parent POM, so a
        # broken Javadoc build fails this job.
        run: mvn -B -ntp -pl graphity-core -am javadoc:javadoc

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Javadoc artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: graphity-core/target/reports/apidocs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
