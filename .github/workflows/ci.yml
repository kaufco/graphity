# Continuous integration: build + tests on every push to main and on every
# pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (e.g. force-pushes to a PR branch) to
# save Action minutes and keep the queue snappy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        # -B: batch mode (no interactive prompts, terse output)
        # -ntp: suppress transfer progress logs (cleaner CI output)
        # verify runs the full reactor: compile, test, package, javadoc-jar.
        run: mvn -B -ntp verify
